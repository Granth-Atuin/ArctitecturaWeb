version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: actividades_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build: ./backend
    # Usamos un wrapper para correr migraciones y luego iniciar gunicorn
    command: sh -c "python manage.py migrate && gunicorn configuracion.wsgi:application --bind 0.0.0.0:8000"
    environment:
      - DB_NAME=actividades_db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    restart: always

  frontend-builder:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_dist:/app/dist
    environment:
      # Usamos el nombre interno del contenedor backend porque corre en tiempo de build en la red de Docker
      - PUBLIC_API_URL=http://backend:8000/api/v1
      - PUBLIC_CLIENT_API_URL=/api/v1
    command: sh -c "npm install && npm run build"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend_dist:/usr/share/nginx/html
    depends_on:
      frontend-builder:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: always

volumes:
  postgres_data:
  frontend_dist:
